[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-ragas"
version = "0.3.0"
description = "Production-ready LangChain RAG pipeline with FAISS vector store and Ragas evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ragas",
    "datasets",
    "openai",
    "pytest",
    "mcp",
    "python-dotenv",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "faiss-cpu",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
