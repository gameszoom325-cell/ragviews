[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.poetry]
package-mode = false

[project]
name = "rag-eval-ragas"
version = "1.0.0"
description = "Production-grade, enterprise-ready LangChain RAG pipeline with FAISS vector store and Ragas evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ragas",
    "datasets",
    "openai",
    "pytest",
    "mcp",
    "python-dotenv",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "faiss-cpu",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.8.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.pytest_cache
  | build
  | dist
  | faiss_index
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_standard_library = ["tomllib"]
skip = [".venv", "build", "dist", "faiss_index"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "build",
    "dist",
    "faiss_index",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length handled by black/formatter
    "E402",  # module level imports after sys.path/warnings
]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
    "\\.venv",
    "build",
    "dist",
]
