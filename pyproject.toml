[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-ragas"
version = "0.2.0"
description = "RAGAS evaluation pipeline with real MCP RAG retrieval integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ragas",
    "datasets",
    "openai",
    "pytest",
    "mcp",
    "python-dotenv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
