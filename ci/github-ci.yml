name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    name: Lint, Typecheck, Test, and Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify Formatting (Black)
        run: black --check .

      - name: Verify Import Ordering (isort)
        run: isort --check-only .

      - name: Static Code Analysis (Ruff)
        run: ruff check .

      - name: Static Type Checking (Mypy)
        run: mypy .

      - name: Run Test Suite with Coverage (Pytest)
        run: pytest --cov=. --cov-report=term-missing

      - name: Execute Ingestion Pipeline
        run: python ingest.py
        env:
          OPENAI_API_KEY: "mock-ci-key-for-embeddings"

      - name: Verify RAG Query Execution
        run: python rag.py
        env:
          OPENAI_API_KEY: "mock-ci-key-for-embeddings"

      - name: Run Comprehensive Pipeline Validation
        run: python validate_pipeline.py
        env:
          OPENAI_API_KEY: "mock-ci-key-for-embeddings"
